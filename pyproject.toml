[project]
name = "freshservice-mcp-managed"
version = "1.0.0"
description = "A managed fork of freshservice-mcp with controlled tool access via allowlists"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "build>=1.2.2.post1",
    "httpx==0.28.1",
    # Upper bound is load-bearing: mcp 2.0 removed mcp.server.fastmcp, so an
    # unpinned dependency resolves to a version this server cannot import.
    "mcp[cli]>=1.28.1,<2",
    "pydantic>=2.10.6",
    # Declared explicitly rather than relied on transitively via mcp[cli].
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    # OAuth 2.1 resource server: JWT access-token validation against the
    # provider's JWKS. The crypto extra supplies RS256 support.
    "pyjwt[crypto]>=2.9.0",
]

[[project.authors]]
name = "Gopi Krishnan"
email = "gopi@effy.co.in"

[[project.authors]]
name = "Maanaesh Swamy"
email = "maanaesh.s@effy.co.in"

[[project.authors]]
name = "Vijay Ragunath"
email = "vijay.r@effy.co.in"

[project.scripts]
freshservice-mcp = "freshservice_mcp.server:main"

